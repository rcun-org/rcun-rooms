# Render Blueprint for rcun-rooms
# Deploy: New → Blueprint → Connect rcun-rooms repo
# Image maksat1/rcun-rooms must exist on Docker Hub first (pushed by GitHub Actions)

services:
  - type: web
    name: rcun-rooms
    runtime: image
    image:
      url: docker.io/maksat1/rcun-rooms:latest

    plan: free

    envVars:
      - key: PORT
        value: 5004
      - key: NODE_ENV
        value: production
      - key: ROOMS_DATABASE_URL
        sync: false
      - key: AUTH_JWT_SECRET
        sync: false

    healthCheckPath: /rooms/health/liveness
